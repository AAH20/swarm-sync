[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-sync"
version = "0.1.0"
description = "Distributed Multi-Version Concurrency Control (MVCC) State Synchronization & Anti-Thundering-Herd Arbiter for High-Concurrency Multi-Agent Swarms"
authors = [
    { name = "Ahmed Hassan", email = "ahmed.alaa.hassan25@gmail.com" }
]
license = { text = "MIT OR Apache-2.0" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "typing_extensions>=4.8.0",
    "anyio>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
