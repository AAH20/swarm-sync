[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-sync"
version = "0.1.0"
description = "Distributed Multi-Version Concurrency Control (MVCC) State Synchronization & Anti-Thundering-Herd Arbiter for High-Concurrency Multi-Agent Swarms"
authors = [
    { name = "Ahmed Hassan", email = "ahmed.alaa.hassan25@gmail.com" }
]
license = { text = "MIT OR Apache-2.0" }
readme = "README.md"
requires-python = ">=3.10"
# No third-party runtime dependencies: mvcc.py and mesh.py use only
# threading/dataclasses/typing from the standard library, and arbiter.py
# uses only asyncio. An earlier version of this file listed pydantic,
# typing_extensions, and anyio here — none were ever imported anywhere in
# the codebase.
dependencies = []

[project.optional-dependencies]
# pytest can run this project's unittest-style tests directly; no async
# tests exist, so pytest-asyncio (previously listed here unused) is gone too.
dev = [
    "pytest>=7.4.0",
]
